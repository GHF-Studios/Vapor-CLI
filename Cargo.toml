[workspace]
resolver = "3"
members = ["crates/vapor_cli", "crates/vapor_sdk_cli"]

[workspace.package]
version = "0.5.0"
edition = "2024"

[workspace.dependencies]
clap = { version = "4.6", features = ["derive"] }
clap-repl = "0.3.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
shlex = "1.3"
toml = "1.1"
vapor_core = { path = "../Vapor/crates/vapor_core" }
vapor_client_provider = { path = "../Vapor/crates/vapor_client_provider" }
